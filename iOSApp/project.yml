name: EURLexMobile
options:
  bundleIdPrefix: com.daniellobo
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  EURLexMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EURLexMobile
        excludes:
          - Support/Info.plist
    settings:
      base:
        PRODUCT_NAME: EURLex
        PRODUCT_BUNDLE_IDENTIFIER: com.daniellobo.eurlexmobile
        INFOPLIST_FILE: EURLexMobile/Support/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
