name: Sunday Edition Refresh

on:
  schedule:
    - cron: "0 3 * * 0" # 05:00 Europe/Amsterdam during CEST, 04:00 during CET
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sunday-edition-refresh
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: Europe/Amsterdam

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-5.4-nano' }}
      OPENAI_WEEKLY_MODEL: ${{ vars.OPENAI_MODEL_WEEKLY || secrets.OPENAI_MODEL_WEEKLY || vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-5.4-nano' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps (root + scripts + workers)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          for f in requirements.txt scripts/requirements.txt workers/requirements.txt; do
            if [ -f "$f" ]; then
              python -m pip install -r "$f"
            fi
          done
          python -m pip check

      - name: Rebuild site payload
        run: |
          if [ -f build_site_data.py ]; then
            python build_site_data.py
          else
            python scripts/build_site_data.py
          fi

      - name: Rebuild Sunday editorial payload
        run: |
          if [ -f build_app_backend.py ]; then
            python build_app_backend.py
          else
            python scripts/build_app_backend.py
          fi

      - name: Validate backend outputs
        run: |
          python scripts/validate_backend_outputs.py

      - name: Publish site bridge
        run: |
          python workers/publish_site_bridge.py

      - name: Ensure .nojekyll in docs
        run: |
          mkdir -p docs
          touch docs/.nojekyll

      - name: Commit results back to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-5.4-nano' }}
          OPENAI_WEEKLY_MODEL: ${{ vars.OPENAI_WEEKLY_MODEL || secrets.OPENAI_WEEKLY_MODEL || vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-5.4-nano' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          stage_and_commit() {
            git add -A docs/data docs/site docs/*.json docs/.nojekyll outputs/docs outputs/timelines reports/daily docs/digests reports/weekly || true
            if git diff --cached --quiet; then
              echo "No Sunday refresh changes to commit"
              return 1
            fi
            git commit -m "refresh sunday edition $(date -u +'%F %T') [auto]"
            return 0
          }

          if ! stage_and_commit; then
            exit 0
          fi

          if git push; then
            exit 0
          fi

          echo "Remote changed; rebuilding Sunday outputs on top of latest main..."
          git reset --hard origin/main
          python scripts/build_site_data.py
          python scripts/build_app_backend.py
          python scripts/validate_backend_outputs.py
          python build_site_data.py
          mkdir -p docs
          touch docs/.nojekyll

          if ! stage_and_commit; then
            exit 0
          fi

          git push
