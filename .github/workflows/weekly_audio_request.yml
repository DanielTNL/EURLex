name: Weekly Audio Request

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Week end date in YYYY-MM-DD format"
        required: false
        type: string
      prompt_hint:
        description: "Optional angle or emphasis for the weekly audio"
        required: false
        type: string

permissions:
  contents: write

jobs:
  weekly-request:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build requested weekly audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts' }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE || 'alloy' }}
          OPENAI_WEEKLY_MODEL: ${{ vars.OPENAI_MODEL_WEEKLY || vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          python audio_overview.py weekly-request \
            --end-date "${{ inputs.end_date }}" \
            --prompt-hint "${{ inputs.prompt_hint }}"

      - name: Refresh site data
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python build_site_data.py
          python build_app_backend.py
          python scripts/validate_backend_outputs.py

      - name: Commit requested weekly audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/audio docs/data
          git commit -m "Add requested weekly audio $(date -u +'%F %T')" || echo "No changes to commit"
          git push || true
