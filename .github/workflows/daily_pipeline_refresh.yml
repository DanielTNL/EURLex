name: Pipeline v2 (daily)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-v2
  cancel-in-progress: false

env:
  TZ: Europe/Amsterdam

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
      OPENAI_WEEKLY_MODEL: ${{ vars.OPENAI_MODEL_WEEKLY || secrets.OPENAI_MODEL_WEEKLY || vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-4o-mini' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (root + scripts + workers)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          for f in requirements.txt scripts/requirements.txt workers/requirements.txt; do
            if [ -f "$f" ]; then
              python -m pip install -r "$f"
            fi
          done
          python -m pip check

      - name: Build daily outputs
        run: bash scripts/run_daily_pipeline.sh

      - name: Show outputs
        run: |
          echo "== docs/data ==" && ls -lah docs/data || true
          echo "== reports ==" && ls -lah reports | tail -n 20 || true
          echo "== reports/daily ==" && ls -lah reports/daily || true
          echo "== docs/digests ==" && ls -lah docs/digests || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-v2-data
          path: |
            outputs/docs/*.ndjson
            outputs/timelines/*.json
            reports/*.md
            reports/daily/*.md
            docs/digests/*.json
            docs/data/*.json
            docs/*.json
            docs/site/*.json
          if-no-files-found: warn

      - name: Commit results back to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          stage_and_commit() {
            git add -A outputs/docs outputs/timelines reports reports/daily docs/digests docs/data docs/site docs/*.json docs/.nojekyll state/seen.json state/latest_discovery.json || true
            if git diff --cached --quiet; then
              echo "No changes to commit"
              return 1
            fi
            git commit -m "daily pipeline v2 $(date -u +'%F %T') [auto]"
            return 0
          }

          if ! stage_and_commit; then
            exit 0
          fi

          if git push; then
            exit 0
          fi

          echo "Remote changed; rebuilding daily outputs on top of latest main..."
          git fetch origin main
          git reset --hard origin/main
          bash scripts/run_daily_pipeline.sh

          if ! stage_and_commit; then
            exit 0
          fi

          git push

      - name: Warm GitHub Pages
        run: |
          curl -sS -I "https://danieltnl.github.io/EURLex/" || true
