name: Pipeline v2 (daily)

on:
  schedule:
    - cron: "45 2 * * *" # 04:45 Europe/Amsterdam during CEST, 03:45 during CET
    - cron: "0 10 * * *" # 12:00 Europe/Amsterdam during CEST, 11:00 during CET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-v2
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: Europe/Amsterdam

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-5.4-nano' }}
      OPENAI_WEEKLY_MODEL: ${{ vars.OPENAI_MODEL_WEEKLY || secrets.OPENAI_MODEL_WEEKLY || vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-5.4-nano' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps (root + scripts + workers)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          for f in requirements.txt scripts/requirements.txt workers/requirements.txt; do
            if [ -f "$f" ]; then
              python -m pip install -r "$f"
            fi
          done
          python -m pip check

      - name: Select refresh mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            PIPELINE_MODE="midday-light"
            RUN_LABEL="midday"
            DISCOVERY_WINDOW="1d"
            DOC_LIMIT="30"
            RUN_REPORT_ONLY="0"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            PIPELINE_MODE="morning-full"
            RUN_LABEL="auto"
            DISCOVERY_WINDOW="1d"
            DOC_LIMIT="50"
            RUN_REPORT_ONLY="1"
          else
            PIPELINE_MODE="manual-full"
            RUN_LABEL="manual"
            DISCOVERY_WINDOW="1d"
            DOC_LIMIT="50"
            RUN_REPORT_ONLY="1"
          fi
          echo "PIPELINE_MODE=${PIPELINE_MODE}" >> "$GITHUB_ENV"
          echo "RUN_LABEL=${RUN_LABEL}" >> "$GITHUB_ENV"
          echo "DISCOVERY_WINDOW=${DISCOVERY_WINDOW}" >> "$GITHUB_ENV"
          echo "DOC_LIMIT=${DOC_LIMIT}" >> "$GITHUB_ENV"
          echo "RUN_REPORT_ONLY=${RUN_REPORT_ONLY}" >> "$GITHUB_ENV"
          echo "Selected mode: ${PIPELINE_MODE}"

      - name: Build daily outputs
        run: bash scripts/run_daily_pipeline.sh

      - name: Show outputs
        run: |
          echo "== docs/data ==" && ls -lah docs/data || true
          echo "== reports ==" && ls -lah reports | tail -n 20 || true
          echo "== reports/daily ==" && ls -lah reports/daily || true
          echo "== docs/digests ==" && ls -lah docs/digests || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-v2-data
          path: |
            outputs/docs/*.ndjson
            outputs/timelines/*.json
            reports/*.md
            reports/daily/*.md
            docs/digests/*.json
            docs/data/*.json
            docs/*.json
            docs/site/*.json
          if-no-files-found: warn

      - name: Commit results back to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          stage_and_commit() {
            git add -A outputs/docs outputs/timelines reports reports/daily docs/digests docs/data docs/site docs/*.json docs/.nojekyll state/seen.json state/latest_discovery.json || true
            if git diff --cached --quiet; then
              echo "No changes to commit"
              return 1
            fi
            git commit -m "daily pipeline v2 $(date -u +'%F %T') [${RUN_LABEL:-auto}]"
            return 0
          }

          if ! stage_and_commit; then
            exit 0
          fi

          if git push; then
            exit 0
          fi

          echo "Remote changed; rebuilding daily outputs on top of latest main..."
          git fetch origin main
          git reset --hard origin/main
          bash scripts/run_daily_pipeline.sh

          if ! stage_and_commit; then
            exit 0
          fi

          git push

      - name: Warm GitHub Pages
        run: |
          curl -sS -I "https://danieltnl.github.io/EURLex/" || true
